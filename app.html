<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Gestión Elite v7.0 - app.html</title>
    
    <!-- Firebase SDKs Globales -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Barra de Navegación Modular */
        .elite-navbar {
            background: #111;
            border-bottom: 2px solid #00e5ff;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            box-sizing: border-box;
        }
        .tab-btn {
            background-color: #2c3e50;
            color: white;
            border: 1px solid #00e5ff;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            font-size: 11px;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            background-color: #00e5ff;
            color: black;
        }
        /* Contenedor Principal Adaptado para Módulos Independientes */
        #app-content {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0b0b0b;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN MODULAR -->
    <div class="elite-navbar">
        <span style="color:#00e5ff; font-weight:bold; font-size:12px; margin-right:10px;">ELITE 7.0:</span>
        <button class="tab-btn" onclick="alert('Módulo de Pacientes')">👥 PACIENTES</button>
        <button class="tab-btn" onclick="alert('Historia Clínica')">📋 HISTORIA CLÍNICA</button>
        <button class="tab-btn" style="background-color: #005f73; border-color: #00e5ff;" onclick="cargarModuloYoico()">🔘 F. YOICAS</button>
        <button class="tab-btn" onclick="alert('Próximo módulo')">🧠 APARATO PSÍQUICO</button>
        <button class="tab-btn" onclick="alert('Próximo módulo')">📊 AGENDA Y PAGOS</button>
    </div>

    <!-- ÁREA DE TRABAJO DINÁMICA -->
    <div id="app-content">
        <div style="margin: auto; text-align: center; color: #666;">
            <h2 style="color: #00e5ff;">Sistema Gestión Elite v7.0</h2>
            <p>Selecciona un módulo en la barra superior para cargar su contenido de forma independiente.</p>
        </div>
    </div>

<script>
    // Configuración global de Firebase (Ajusta tus credenciales reales aquí si es necesario)
    /*
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "TU_AUTH_DOMAIN",
        projectId: "TU_PROJECT_ID",
        storageBucket: "TU_STORAGE_BUCKET",
        messagingSenderId: "TU_MESSAGING_SENDER_ID",
        appId: "TU_APP_ID"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    */

    // Variable global de control del paciente activo para los módulos
    window.pacienteActualId = "paciente_general_demo";

    // Función limpia que carga el archivo independiente sin romper rutas ni generar 404
    function cargarModuloYoico() {
        const contenedor = document.getElementById('app-content');
        contenedor.innerHTML = `<iframe src="elite_func_yoicas.html"></iframe>`;
    }
</script>

</body>
</html>
