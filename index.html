<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | ELITE 2.0 - Clínica de la Convergencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #0d9488;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-card { background: var(--card-bg); border-radius: 10px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid var(--primary-color); text-align: center; }
        .login-card i.fa-brain { font-size: 3.5rem; color: var(--primary-color); margin-bottom: 15px; }
        h1 { font-size: 1.4rem; color: var(--primary-color); margin-bottom: 5px; }
        p.subtitle { font-size: 0.8rem; color: #64748b; margin-bottom: 25px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: var(--primary-color); }
        input[type="password"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; }
        input[type="password"]:focus { outline: none; border-color: var(--secondary-color); }
        
        .btn-login { background-color: var(--primary-color); color: white; border: none; width: 100%; padding: 11px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
        .btn-login:hover { background-color: #172554; }
        
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <i class="fa-solid fa-brain"></i>
        <h1>Clínica de la Convergencia</h1>
        <p class="subtitle">Sistema Integral ELITE 2.0 — Dr. y Mgter. Rubén M. Pereyra</p>
        
        <form id="login-form">
            <div class="form-group">
                <label for="password">Contraseña de Acceso Institucional</label>
                <input type="password" id="password" required placeholder="Ingrese la contraseña...">
            </div>
            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Ingresar al Sistema</button>
            <div id="error-msg" class="error-msg">Contraseña incorrecta. Intente nuevamente.</div>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const errorEl = document.getElementById('error-msg');

            // Contraseña institucional definida
            if (pass === 'clinica2026') {
                sessionStorage.setItem('clinica_auth', 'true');
                window.location.href = 'app.html';
            } else {
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
