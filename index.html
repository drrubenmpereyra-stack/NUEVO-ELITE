<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - ELITE 2.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --secondary-color: #0d9488;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: var(--card-bg); border-radius: 12px; padding: 40px 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(30, 58, 138, 0.1); text-align: center; border-top: 5px solid var(--secondary-color); }
        .login-logo { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 3px solid var(--secondary-color); }
        .login-title { font-size: 1.3rem; color: var(--primary-color); font-weight: 700; margin-bottom: 4px; }
        .login-subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 25px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--primary-color); }
        input { width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.95rem; }
        input:focus { outline: none; border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1); }
        .btn-login { background-color: var(--primary-color); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-login:hover { background-color: #172554; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="Logotipo.jpg" alt="Logotipo Clínica" class="login-logo">
        <h1 class="login-title">Clínica de la Convergencia</h1>
        <p class="login-subtitle">ELITE 2.0</p>
        <form id="login-form">
            <div class="form-group">
                <label for="username"><i class="fa-solid fa-user"></i> Usuario</label>
                <input type="text" id="username" required autocomplete="username" placeholder="Ingrese usuario">
            </div>
            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password" placeholder="Ingrese contraseña">
            </div>
            <button type="submit" class="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Ingresar al Sistema</button>
            <div id="error-message" class="error-msg"><i class="fa-solid fa-triangle-exclamation"></i> Usuario o contraseña incorrectos.</div>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (user === 'DRPEREYRA' && pass === '235689') {
                sessionStorage.setItem('clinica_auth', 'true');
                window.location.href = 'app.html';
            } else {
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
