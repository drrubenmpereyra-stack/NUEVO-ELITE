<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Gestión Elite 7.0</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .elite-navbar {
            background: #111;
            border-bottom: 2px solid #00e5ff;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            background-color: #2c3e50;
            color: white;
            border: 1px solid #00e5ff;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            font-size: 11px;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            background-color: #00e5ff;
            color: black;
        }
        #app-content {
            flex: 1;
            position: relative;
            background: #000;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #050505;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN PRINCIPAL -->
    <div class="elite-navbar">
        <span style="color:#00e5ff; font-weight:bold; font-size:12px; margin-right:10px;">ELITE 7.0:</span>
        <button class="tab-btn" onclick="alert('Módulo de Pacientes')">👥 PACIENTES</button>
        <button class="tab-btn" onclick="alert('Historia Clínica')">📋 HISTORIA CLÍNICA</button>
        <button class="tab-btn" style="background-color: #005f73; border-color: #00e5ff;" onclick="cargarModuloYoico()">🔘 F. YOICAS</button>
        <button class="tab-btn" onclick="alert('Próximo módulo')">🧠 APARATO PSÍQUICO</button>
        <button class="tab-btn" onclick="alert('Próximo módulo')">📊 AGENDA Y PAGOS</button>
    </div>

    <!-- CONTENEDOR DE TRABAJO -->
    <div id="app-content">
        <div style="margin: auto; text-align: center; color: #666;">
            <h2 style="color: #00e5ff;">Sistema Gestión Elite 7.0</h2>
            <p>Selecciona un módulo en la barra superior para comenzar.</p>
        </div>
    </div>

<script>
    // Variable global del paciente activo para los módulos independientes
    window.pacienteActualId = "paciente_general_demo";

    // Función para cargar el módulo independiente sin errores 404
    function cargarModuloYoico() {
        const contenedor = document.getElementById('app-content');
        contenedor.innerHTML = `<iframe src="elite_func_yoicas.html"></iframe>`;
    }
</script>

</body>
</html>
