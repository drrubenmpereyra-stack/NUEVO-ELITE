<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eje 2: Funciones Yoicas - ELITE 2.0</title>
    <!-- Firebase SDKs Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .module-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
            border: 2px solid #00e5ff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="module-container">
    <!-- CABECERA DE FILTROS -->
    <div style="background:#151515; padding:12px; border-bottom:1px solid #00e5ff; display:flex; gap:15px; align-items:center;">
        <b style="color:#00e5ff; font-size:11px;">ESTADÍSTICA FUNCIONES YOICAS:</b>
        <input type="date" id="stats-yo-inicio" style="background:#222; color:#fff; border:1px solid #00e5ff; padding:5px; font-size:11px; border-radius:4px;">
        <input type="date" id="stats-yo-fin" style="background:#222; color:#fff; border:1px solid #00e5ff; padding:5px; font-size:11px; border-radius:4px;">
    </div>

    <!-- CUERPO DE EVALUACIÓN (SCROLL) -->
    <div id="valyo-indicadores-scroll" style="flex:1; overflow-y:auto; padding:20px; border-bottom:2px solid #00e5ff;"></div>

    <!-- PANEL DE CONTROL E INFERIOR -->
    <div style="height:320px; background:#0a0a0a; padding:15px; display:flex; flex-direction:column; box-sizing:border-box;">
        <div style="display:flex; gap:8px; margin-bottom:12px;">
            <button onclick="medirValYo()" style="flex:1; background:#00e5ff; color:black; font-weight:bold; padding:10px; cursor:pointer; border:none; border-radius:5px;">📊 MEDIR / GRAFICAR</button>
            <button onclick="interpretarIAValYo()" style="flex:1; background:#b21f1f; color:white; font-weight:bold; padding:10px; cursor:pointer; border:none; border-radius:5px;">🤖 INFORME IA</button>
            <button onclick="guardarValYo()" style="flex:1; background:#27ae60; color:white; font-weight:bold; padding:10px; cursor:pointer; border:none; border-radius:5px;">💾 GUARDAR EN BD</button>
        </div>
        
        <div id="valyo-consola" style="flex:1; border:1px solid #333; background:#000; padding:12px; overflow-y:auto; border-radius:8px; display:flex; flex-direction:column;">
            <div id="eq-main" style="display:flex; align-items:flex-end; justify-content:space-around; height:70px; border-bottom:1px solid #222; padding-bottom:15px; margin-bottom:10px;"></div>
            <div id="ia-informe" style="font-size:11px; color:#ccc; margin-bottom:10px;"></div>
            <div id="etiquetas-listado" style="display:flex; flex-direction:column; gap:6px;"></div>
        </div>
    </div>
</div>

<script>
    const rubricaValYo = {
        "Función de Realidad": {
            criterio: "Capacidad de distinguir estímulos internos de externos (Corteza Prefrontal / Juicio Crítico).",
            n1: "Alucinaciones, delirios o pérdida total de objetividad.",
            n2: "Proyecciones frecuentes; distorsiones ante el estrés.",
            n3: "Juicio de realidad conservado: capacidad de autocrítica."
        },
        "Regulación de Impulsos": {
            criterio: "Control inhibitorio y tolerancia a la frustración (Circuito Órbito-frontal).",
            n1: "Actuación (Acting-out) inmediata; incapacidad de postergar.",
            n2: "Impulsividad selectiva; sentimientos de culpa posteriores.",
            n3: "Elevada tolerancia a la frustración; demora de gratificación."
        },
        "Mecanismos de Defensa": {
            criterio: "Estrategias de mediación ante el conflicto (Madurez del procesamiento emocional).",
            n1: "Defensas primarias (escisión, negación, identificación proyectiva).",
            n2: "Defensas neuróticas (represión, formación reactiva, desplazamiento).",
            n3: "Defensas maduras (sublimación, humor, supresión consciente)."
        },
        "Integración de Identidad": {
            criterio: "Continuidad del 'Self' y cohesión imagen corporal (Red de Modo Predeterminado).",
            n1: "Identidad difusa; sentimiento de vacío; fragmentación corporal.",
            n2: "Identidad inestable; dependencia excesiva del entorno.",
            n3: "Identidad cohesiva; sentido histórico del sí mismo."
        },
        "Función Sintético-Asociativa": {
            criterio: "Capacidad de organizar la experiencia y el pensamiento (Integración Hemisférica).",
            n1: "Pensamiento desorganizado; incapacidad de jerarquizar.",
            n2: "Dificultad para vincular afecto y pensamiento (alexitimia parcial).",
            n3: "Excelente capacidad de insight y simbolización."
        }
    };

    window.onload = async function() {
        renderValYoCampos();
        await cargarHistoricoValYo();
    };

    function renderValYoCampos() {
        const areaScroll = document.getElementById('valyo-indicadores-scroll');
        if (!areaScroll) return;
        
        areaScroll.innerHTML = "";
        Object.keys(rubricaValYo).forEach(key => {
            const data = rubricaValYo[key];
            const divInd = document.createElement('div');
            divInd.style = "background:#111; padding:12px; margin-bottom:10px; border-left:5px solid #00e5ff; border-radius:5px;";
            divInd.title = `CRITERIO: ${data.criterio}`;
            divInd.innerHTML = `
                <b style="color:#00e5ff; display:block; margin-bottom:8px; font-size:12px;">${key.toUpperCase()}</b>
                <div style="display:flex; justify-content:space-between;">
                    <label title="${data.n1}" style="color:#ff5252; cursor:help; font-size:11px;"><input type="radio" name="yo_${key}" value="1"> Nivel 1</label>
                    <label title="${data.n2}" style="color:#ffd740; cursor:help; font-size:11px;"><input type="radio" name="yo_${key}" value="2"> Nivel 2</label>
                    <label title="${data.n3}" style="color:#69f0ae; cursor:help; font-size:11px;"><input type="radio" name="yo_${key}" value="3"> Nivel 3</label>
                </div>`;
            areaScroll.appendChild(divInd);
        });
    }

    function medirValYo() {
        const eq = document.getElementById('eq-main');
        if (!eq) return;
        eq.innerHTML = "";
        
        Object.keys(rubricaValYo).forEach(key => {
            const val = document.querySelector(`input[name="yo_${key}"]:checked`)?.value || 0;
            const h = (val / 3) * 100;
            const color = val <= 1.5 ? '#ff5252' : val <= 2.5 ? '#ffd740' : '#69f0ae';
            eq.innerHTML += `
                <div style="width:18%; height:100%; display:flex; flex-direction:column; align-items:center; position:relative;">
                    <div style="width:16px; height:100%; background:#222; position:relative; border:1px solid #444; border-radius:3px;">
                        <div style="position:absolute; bottom:0; width:100%; height:${h}%; background:${color};"></div>
                    </div>
                    <span style="font-size:6px; color:#fff; margin-top:4px; text-align:center; white-space:nowrap;">${key}</span>
                </div>`;
        });
    }

    function interpretarIAValYo() {
        const iaBox = document.getElementById('ia-informe');
        if (!iaBox) return;
        let total = 0;
        let reporte = "<b>INFORME RVC-YO:</b><br>";
        
        Object.keys(rubricaValYo).forEach(key => {
            const v = document.querySelector(`input[name="yo_${key}"]:checked`)?.value;
            if(v) {
                total += parseInt(v);
                reporte += `• ${key}: Nivel ${v}<br>`;
            }
        });
        
        let escala = total <= 8 ? "Rango Deficitario" : total <= 12 ? "Rango Neurótico" : "Fortaleza Yoica";
        iaBox.innerHTML = `${reporte}<b style="color:#00e5ff;">TOTAL: ${total} pts - ${escala}</b>`;
    }

    async function guardarValYo() {
        const pacienteId = window.parent.pacienteActualId || "paciente_general_demo";
        let vals = {}; 
        let total = 0;
        
        Object.keys(rubricaValYo).forEach(k => {
            const val = document.querySelector(`input[name="yo_${k}"]:checked`)?.value || 0;
            vals[k] = parseInt(val);
            total += parseInt(val);
        });

        if (total === 0) {
            alert("Selecciona al menos un valor antes de guardar.");
            return;
        }

        try {
            if (typeof db !== 'undefined') {
                await db.collection("pacientes").doc(pacienteId).collection("evaluaciones_yoicas").add({
                    fecha: new Date().toISOString(),
                    puntajes: vals,
                    puntajeTotal: total,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            alert("¡Evaluación guardada en Firestore!");
            await cargarHistoricoValYo();
        } catch (error) {
            console.error("Error al guardar:", error);
            alert("Error al conectar con la base de datos.");
        }
    }

    async function cargarHistoricoValYo() {
        const pacienteId = window.parent.pacienteActualId || "paciente_general_demo";
        const etiquetaListado = document.getElementById('etiquetas-listado');
        if (!etiquetaListado) return;
        
        etiquetaListado.innerHTML = "<span style='color:#666; font-size:11px;'>Cargando histórico...</span>";

        try {
            if (typeof db !== 'undefined') {
                const snapshot = await db.collection("pacientes").doc(pacienteId).collection("evaluaciones_yoicas").orderBy("createdAt", "desc").get();
                etiquetaListado.innerHTML = "";

                if (snapshot.empty) {
                    etiquetaListado.innerHTML = "<span style='color:#666; font-size:11px;'>Sin registros previos.</span>";
                    return;
                }

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const fecha = data.fecha ? new Date(data.fecha).toLocaleString() : "Fecha";
                    const tag = document.createElement('div');
                    tag.style = "background:#111; border:1px solid #00e5ff; padding:4px 8px; font-size:10px; color:#fff; border-radius:4px; display:flex; justify-content:space-between;";
                    tag.innerHTML = `<span><b>[${fecha}]</b> Total: ${data.puntajeTotal} pts</span> <span style="color:#00e5ff;">Sincronizado</span>`;
                    etiquetaListado.appendChild(tag);
                });
            }
        } catch (error) {
            console.error("Error histórico:", error);
            etiquetaListado.innerHTML = "<span style='color:#ff5252; font-size:11px;'>Error al recuperar histórico.</span>";
        }
    }
</script>
</body>
</html>
